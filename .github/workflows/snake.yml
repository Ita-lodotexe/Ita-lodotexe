name: Generate Pac-Man

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Generate Pac-Man
        uses: abozanona/pacman-contribution-graph@v2
        with:
          username: ${{ github.repository_owner }}
          github_token: ${{ secrets.GITHUB_TOKEN }} # Corrigido aqui

      # Passo novo: Cria a pasta e move o arquivo pra lá
      - name: Move to dist
        run: |
          mkdir -p dist
          mv pacman-graph.svg dist/

      - name: Push to Output Branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
